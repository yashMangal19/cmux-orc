<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=block");
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
  </style>
  <rect width="1200" height="630" fill="#0d1117"/>
  <rect x="0" y="0" width="1200" height="6" fill="#2ec4b6"/>

  <!-- Wordmark -->
  <g transform="translate(80 84)">
    <circle cx="16" cy="20" r="9" fill="#2ec4b6"/>
    <rect x="31" y="5" width="16" height="6" rx="3" fill="#e6eaf0"/>
    <rect x="31" y="17" width="16" height="6" rx="3" fill="#e6eaf0"/>
    <rect x="31" y="29" width="16" height="6" rx="3" fill="#e6eaf0"/>
    <text x="62" y="31" class="sans" font-size="30" font-weight="700" letter-spacing="-0.6" fill="#e6eaf0">cmux-orc</text>
  </g>

  <!-- Headline -->
  <text class="sans" font-size="50" font-weight="700" letter-spacing="-1.4" fill="#e6eaf0">
    <tspan x="80" y="250">Run a team of</tspan>
    <tspan x="80" y="310">Claude Code sessions.</tspan>
    <tspan x="80" y="370" fill="#2ec4b6">See which one needs you.</tspan>
  </text>
  <text class="sans" font-size="23" font-weight="400" fill="#9aa4b2">
    <tspan x="80" y="440">One Orc session runs the team as cmux tabs.</tspan>
    <tspan x="80" y="472">A sidebar shows each session's status and stage.</tspan>
  </text>
  <text x="80" y="560" class="mono" font-size="19" fill="#6b7584">github.com/yashMangal19/cmux-orc · MIT</text>

  <!-- Sidebar panel (fictional team) -->
  <g transform="translate(770 150)">
    <rect width="350" height="330" rx="16" fill="#151b23" stroke="#2a3340"/>
    <circle cx="30" cy="38" r="6" fill="#2ec4b6"/>
    <text x="46" y="44" class="sans" font-size="17" font-weight="600" fill="#e6eaf0">Shop-Orc</text>
    <line x1="20" y1="66" x2="330" y2="66" stroke="#2a3340"/>

    <g class="sans">
      <g transform="translate(0 78)">
        <circle cx="30" cy="22" r="5.5" fill="#0a84ff"/>
        <text x="46" y="27" font-size="17" font-weight="500" fill="#e6eaf0">QA</text>
        <text x="314" y="27" text-anchor="end" class="mono" font-size="14" fill="#6b7584">12m</text>
        <text x="46" y="50" font-size="14" fill="#9aa4b2">case 41/88</text>
      </g>
      <g transform="translate(0 140)">
        <rect x="12" y="-2" width="326" height="62" rx="10" fill="#ff453a14"/>
        <circle cx="30" cy="22" r="5.5" fill="#ff453a"/>
        <text x="46" y="27" font-size="17" font-weight="500" fill="#e6eaf0">API</text>
        <text x="314" y="27" text-anchor="end" class="mono" font-size="14" fill="#6b7584">2m</text>
        <text x="46" y="50" font-size="14" fill="#ff453a">⚠ needs you · migrate orders</text>
      </g>
      <g transform="translate(0 202)">
        <circle cx="30" cy="22" r="5.5" fill="#0a84ff"/>
        <text x="46" y="27" font-size="17" font-weight="500" fill="#e6eaf0">Docs</text>
        <text x="314" y="27" text-anchor="end" class="mono" font-size="14" fill="#6b7584">5m</text>
        <text x="46" y="50" font-size="14" fill="#9aa4b2">writing install guide</text>
      </g>
      <g transform="translate(0 264)">
        <circle cx="30" cy="22" r="5.5" fill="#34c759"/>
        <text x="46" y="27" font-size="17" font-weight="500" fill="#e6eaf0">Release</text>
        <text x="314" y="27" text-anchor="end" class="mono" font-size="14" fill="#6b7584">1h 04m</text>
        <text x="46" y="50" font-size="14" fill="#6b7584">idle</text>
      </g>
    </g>
  </g>
</svg>
